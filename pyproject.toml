[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photobook-curator"
version = "0.1.0"
description = "Lokales CLI-Tool zur Kuratierung eines Urlaubs-Fotobuchs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0",
  "exifread>=3.0.0",
  "pillow-heif>=0.13.0",
  "opencv-python-headless>=4.8.0",
  "mediapipe>=0.10.0",
  "imagehash>=4.3.1",
  "geopy>=2.4.0",
  "scikit-learn>=1.3.0",
  "anthropic>=0.40.0",
  "tqdm>=4.66.0",
  "numpy>=1.24.0",
  "piexif>=1.1.3",
]

[project.scripts]
photobook-curator = "photobook_curator.cli:main"
photobook-curator-gui = "photobook_curator.gui:main"

[tool.setuptools.packages.find]
include = ["photobook_curator*"]
